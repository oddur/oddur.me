baseURL = 'https://oddur.me/'
languageCode = 'en-us'
title = 'Oddur Magnusson'
theme = 'PaperMod'
googleAnalytics = 'G-7CFN4T27KD'

[params]
  env = 'production'
  defaultTheme = 'auto'
  showReadingTime = true
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true

  [params.profileMode]
    enabled = true
    title = 'Oddur Magnusson'
    subtitle = ''
    imageUrl = ''
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = 'Posts'
      url = '/posts/'

    [[params.profileMode.buttons]]
      name = 'About'
      url = '/about/'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/oddur'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/magnusson/'

  [[params.socialIcons]]
    name = 'x'
    url = 'https://x.com/oddur'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10

  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 20
