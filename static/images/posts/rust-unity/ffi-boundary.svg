<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490">
<style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .pf-title { font-size: 14px; font-weight: 600; fill: #e2e2e2; }
    .pf-label { font-size: 11px; fill: #a0a0a0; }
    .pf-small { font-size: 10px; fill: #888; }
    .pf-mono { font-size: 11px; fill: #a0a0a0; font-family: ui-monospace, SFMono-Regular, monospace; }
    .pf-a { opacity: 0; }
    @keyframes pfFade { to { opacity: 1; } }
    @keyframes pfFlash { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0.9; } }
    .pf-cell-fill { opacity: 0; }
</style>
<rect width="720" height="490" fill="#1a1a2e" rx="8"/>
<text x="30" y="34" class="pf-title">One call, zero copies</text>

<text x="170" y="66" text-anchor="middle" class="pf-title" fill="#c77730">C# in Unity</text>
<text x="560" y="66" text-anchor="middle" class="pf-title" fill="#4a8ccc">Rust</text>
<line x1="360" y1="94" x2="360" y2="252" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
<text x="360" y="86" text-anchor="middle" class="pf-small">P/Invoke boundary</text>

<text x="40" y="96" class="pf-mono">ai_score(</text>
<text x="40" y="112" class="pf-mono">  ref needs[0],</text>
<text x="40" y="128" class="pf-mono">  ref scorers[0],</text>
<text x="40" y="144" class="pf-mono">  ref results[0])</text>
<text x="40" y="168" class="pf-small pf-a" style="animation: pfFade 0.4s 0.4s forwards">a reference to the first element</text>
<text x="40" y="182" class="pf-small pf-a" style="animation: pfFade 0.4s 0.4s forwards">is just that element's address</text>

<g class="pf-a" style="animation: pfFade 0.4s 0.8s forwards">
<rect x="228" y="130" width="112" height="22" rx="11" fill="none" stroke="#c77730" stroke-width="1.5"/>
<text x="284" y="145" text-anchor="middle" class="pf-small" fill="#c77730">3 addresses cross</text>
<line x1="344" y1="141" x2="426" y2="141" stroke="#888" stroke-width="1.5"/>
<polygon points="424,136 434,141 424,146" fill="#888"/>
</g>

<text x="450" y="96" class="pf-mono pf-a" style="animation: pfFade 0.4s 1.3s forwards">from_raw_parts(ptr, len)</text>
<g class="pf-a" style="animation: pfFade 0.35s 1.5s forwards">
<rect x="450" y="108" width="180" height="22" rx="11" fill="none" stroke="#4a8ccc" stroke-width="1.5"/>
<text x="540" y="123" text-anchor="middle" class="pf-small" fill="#4a8ccc">needs: &amp;[f32]</text>
</g>
<g class="pf-a" style="animation: pfFade 0.35s 1.7s forwards">
<rect x="450" y="140" width="180" height="22" rx="11" fill="none" stroke="#4a8ccc" stroke-width="1.5"/>
<text x="540" y="155" text-anchor="middle" class="pf-small" fill="#4a8ccc">scorers: &amp;[Scorer]</text>
</g>
<g class="pf-a" style="animation: pfFade 0.35s 1.9s forwards">
<rect x="450" y="172" width="180" height="22" rx="11" fill="none" stroke="#4a8ccc" stroke-width="1.5"/>
<text x="540" y="187" text-anchor="middle" class="pf-small" fill="#4a8ccc">results: &amp;mut [u32]</text>
</g>

<g class="pf-a" style="animation: pfFade 0.4s 4.1s forwards">
<line x1="426" y1="218" x2="290" y2="218" stroke="#888" stroke-width="1.5"/>
<polygon points="292,213 282,218 292,223" fill="#888"/>
<text x="358" y="212" text-anchor="middle" class="pf-small">return 0, the only thing that comes back</text>
</g>

<rect x="30" y="270" width="660" height="150" rx="6" fill="#20203a"/>
<text x="42" y="292" class="pf-label">the C# managed heap</text>

<!-- one contiguous band: fillers + three array ranges -->
<rect x="50" y="306" width="56" height="24" rx="3" fill="#26263e" opacity="0.7"/><text x="78" y="322" text-anchor="middle" class="pf-small" opacity="0.6">…</text>
<g>
<rect x="110" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="130" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="150" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="170" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="190" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="210" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="230" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/>
</g>
<rect x="252" y="306" width="44" height="24" rx="3" fill="#26263e" opacity="0.7"/><text x="274" y="322" text-anchor="middle" class="pf-small" opacity="0.6">…</text>
<g>
<rect x="300" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="320" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="340" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="360" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="380" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="400" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="420" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/><rect x="440" y="306" width="18" height="24" rx="3" fill="#c77730" fill-opacity="0.75"/>
</g>
<rect x="462" y="306" width="34" height="24" rx="3" fill="#26263e" opacity="0.7"/><text x="479" y="322" text-anchor="middle" class="pf-small" opacity="0.6">…</text>
<g>
<rect x="500" y="306" width="18" height="24" rx="3" fill="#26263e" stroke="#333"/><rect x="520" y="306" width="18" height="24" rx="3" fill="#26263e" stroke="#333"/><rect x="540" y="306" width="18" height="24" rx="3" fill="#26263e" stroke="#333"/><rect x="560" y="306" width="18" height="24" rx="3" fill="#26263e" stroke="#333"/><rect x="580" y="306" width="18" height="24" rx="3" fill="#26263e" stroke="#333"/><rect x="600" y="306" width="18" height="24" rx="3" fill="#26263e" stroke="#333"/><rect x="620" y="306" width="18" height="24" rx="3" fill="#26263e" stroke="#333"/>
</g>
<rect class="pf-cell-fill" x="500" y="306" width="18" height="24" rx="3" fill="#4a8ccc" fill-opacity="0.85" style="animation: pfFlash 0.35s 2.60s forwards"/>
<rect class="pf-cell-fill" x="520" y="306" width="18" height="24" rx="3" fill="#4a8ccc" fill-opacity="0.85" style="animation: pfFlash 0.35s 2.76s forwards"/>
<rect class="pf-cell-fill" x="540" y="306" width="18" height="24" rx="3" fill="#4a8ccc" fill-opacity="0.85" style="animation: pfFlash 0.35s 2.92s forwards"/>
<rect class="pf-cell-fill" x="560" y="306" width="18" height="24" rx="3" fill="#4a8ccc" fill-opacity="0.85" style="animation: pfFlash 0.35s 3.08s forwards"/>
<rect class="pf-cell-fill" x="580" y="306" width="18" height="24" rx="3" fill="#4a8ccc" fill-opacity="0.85" style="animation: pfFlash 0.35s 3.24s forwards"/>
<rect class="pf-cell-fill" x="600" y="306" width="18" height="24" rx="3" fill="#4a8ccc" fill-opacity="0.85" style="animation: pfFlash 0.35s 3.40s forwards"/>
<rect class="pf-cell-fill" x="620" y="306" width="18" height="24" rx="3" fill="#4a8ccc" fill-opacity="0.85" style="animation: pfFlash 0.35s 3.56s forwards"/>
<rect x="642" y="306" width="28" height="24" rx="3" fill="#26263e" opacity="0.7"/><text x="656" y="322" text-anchor="middle" class="pf-small" opacity="0.6">…</text>

<!-- length brackets under each range -->
<g stroke="#666" stroke-width="1" fill="none">
<path d="M 110 338 L 110 344 L 248 344 L 248 338"/>
<path d="M 300 338 L 300 344 L 458 344 L 458 338"/>
<path d="M 500 338 L 500 344 L 638 344 L 638 338"/>
</g>
<text x="179" y="360" text-anchor="middle" class="pf-small">needs, len 1200</text>
<text x="379" y="360" text-anchor="middle" class="pf-small">scorers, len 6000</text>
<text x="569" y="360" text-anchor="middle" class="pf-small">results, len 200</text>

<!-- legend + pin note -->
<rect x="42" y="390" width="14" height="12" rx="2" fill="#c77730" fill-opacity="0.75"/>
<text x="62" y="400" class="pf-small">written by C#, read by Rust</text>
<rect x="240" y="390" width="14" height="12" rx="2" fill="#4a8ccc" fill-opacity="0.85"/>
<text x="260" y="400" class="pf-small">written by Rust, read by C#</text>
<text x="678" y="400" text-anchor="end" class="pf-small">pinned in place for the duration of the call</text>

<!-- slice arrows landing on the START of each range -->
<g class="pf-a" style="animation: pfFade 0.4s 2.3s forwards" fill="none" stroke="#4a8ccc" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6">
<path d="M 630 119 L 670 119 L 670 266 L 110 266 L 110 298"/>
<path d="M 630 151 L 656 151 L 656 258 L 300 258 L 300 298"/>
<path d="M 630 183 L 642 183 L 642 250 L 500 250 L 500 298"/>
</g>
<g class="pf-a" style="animation: pfFade 0.4s 2.3s forwards" fill="#4a8ccc" fill-opacity="0.7">
<polygon points="105,297 115,297 110,304"/>
<polygon points="295,297 305,297 300,304"/>
<polygon points="495,297 505,297 500,304"/>
</g>
<text x="560" y="210" text-anchor="middle" class="pf-small pf-a" style="animation: pfFade 0.4s 2.5s forwards" fill="#4a8ccc" fill-opacity="0.8">each slice points at where</text>
<text x="560" y="224" text-anchor="middle" class="pf-small pf-a" style="animation: pfFade 0.4s 2.5s forwards" fill="#4a8ccc" fill-opacity="0.8">its array starts</text>

<text x="30" y="452" class="pf-label pf-a" style="animation: pfFade 0.5s 4.5s forwards">The heap is one address space and each array is a range inside it. A slice is the range's start</text>
<text x="30" y="468" class="pf-label pf-a" style="animation: pfFade 0.5s 4.5s forwards">address plus a length, so Rust reads and writes C#'s memory in place. Nothing is copied either way.</text>
</svg>
