<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430">
<style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .pf-title { font-size: 14px; font-weight: 600; fill: #e2e2e2; }
    .pf-label { font-size: 11px; fill: #a0a0a0; }
    .pf-small { font-size: 10px; fill: #888; }
    .pf-head { font-size: 12px; font-weight: 600; }
    .pf-a { opacity: 0; }
    @keyframes pfFade { to { opacity: 1; } }
</style>
<rect width="720" height="430" fill="#1a1a2e" rx="8"/>
<text x="30" y="34" class="pf-title">One decision: score every action, keep the best</text>

<g class="pf-a" style="animation: pfFade 0.4s 0.3s forwards">
<rect x="30" y="66" width="180" height="216" rx="8" fill="#20203a"/>
<text x="120" y="90" text-anchor="middle" class="pf-head" fill="#c77730">one character</text>
<text x="46" y="120" class="pf-small">hunger</text>
<rect x="110" y="112" width="84" height="8" rx="4" fill="#26263e"/><rect x="110" y="112" width="59" height="8" rx="4" fill="#c77730" fill-opacity="0.8"/>
<text x="46" y="146" class="pf-small">energy</text>
<rect x="110" y="138" width="84" height="8" rx="4" fill="#26263e"/><rect x="110" y="138" width="25" height="8" rx="4" fill="#c77730" fill-opacity="0.8"/>
<text x="46" y="172" class="pf-small">safety</text>
<rect x="110" y="164" width="84" height="8" rx="4" fill="#26263e"/><rect x="110" y="164" width="76" height="8" rx="4" fill="#c77730" fill-opacity="0.8"/>
<text x="46" y="198" class="pf-small">boredom</text>
<rect x="110" y="190" width="84" height="8" rx="4" fill="#26263e"/><rect x="110" y="190" width="42" height="8" rx="4" fill="#c77730" fill-opacity="0.8"/>
<text x="46" y="232" class="pf-small">position x, y</text>
<text x="46" y="260" class="pf-small" fill="#666">distance to each action</text>
<text x="46" y="273" class="pf-small" fill="#666">is computed from it</text>
</g>

<g class="pf-a" style="animation: pfFade 0.3s 0.7s forwards">
<line x1="214" y1="174" x2="240" y2="174" stroke="#888" stroke-width="1.5"/>
<polygon points="238,169 248,174 238,179" fill="#888"/>
</g>

<g class="pf-a" style="animation: pfFade 0.4s 0.9s forwards">
<rect x="252" y="66" width="268" height="316" rx="8" fill="#20203a"/>
<text x="386" y="90" text-anchor="middle" class="pf-head" fill="#a0a0a0">one action, six scorers</text>
</g>

<g class="pf-a" style="animation: pfFade 0.3s 1.1s forwards">
<rect x="266" y="102" width="240" height="36" rx="4" fill="#26263e"/>
<rect x="272" y="106" width="38" height="28" rx="3" fill="#1a1a2e"/>
<path d="M 276 128 C 288 128 290 112 306 112" fill="none" stroke="#9668d4" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="124" class="pf-small" fill="#e2e2e2">hunger, logistic</text>
<text x="498" y="124" text-anchor="end" class="pf-small">× 0.9</text>
</g>
<g class="pf-a" style="animation: pfFade 0.3s 1.2s forwards">
<rect x="266" y="146" width="240" height="36" rx="4" fill="#26263e"/>
<rect x="272" y="150" width="38" height="28" rx="3" fill="#1a1a2e"/>
<path d="M 276 172 C 284 172 284 156 291 156 C 298 156 298 172 306 172" fill="none" stroke="#d18238" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="168" class="pf-small" fill="#e2e2e2">distance, gaussian</text>
<text x="498" y="168" text-anchor="end" class="pf-small">× 0.7</text>
</g>
<g class="pf-a" style="animation: pfFade 0.3s 1.3s forwards">
<rect x="266" y="190" width="240" height="36" rx="4" fill="#26263e"/>
<rect x="272" y="194" width="38" height="28" rx="3" fill="#1a1a2e"/>
<path d="M 276 216 L 306 200" fill="none" stroke="#4a8ccc" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="212" class="pf-small" fill="#e2e2e2">energy, linear</text>
<text x="498" y="212" text-anchor="end" class="pf-small">× 0.6</text>
</g>
<g class="pf-a" style="animation: pfFade 0.3s 1.4s forwards">
<rect x="266" y="234" width="240" height="36" rx="4" fill="#26263e"/>
<rect x="272" y="238" width="38" height="28" rx="3" fill="#1a1a2e"/>
<path d="M 276 260 Q 296 257 306 244" fill="none" stroke="#46a866" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="256" class="pf-small" fill="#e2e2e2">safety, quadratic</text>
<text x="498" y="256" text-anchor="end" class="pf-small">× 0.8</text>
</g>
<g class="pf-a" style="animation: pfFade 0.3s 1.5s forwards">
<rect x="266" y="278" width="240" height="36" rx="4" fill="#26263e"/>
<rect x="272" y="282" width="38" height="28" rx="3" fill="#1a1a2e"/>
<path d="M 276 304 L 306 288" fill="none" stroke="#4a8ccc" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="300" class="pf-small" fill="#e2e2e2">boredom, linear</text>
<text x="498" y="300" text-anchor="end" class="pf-small">× 0.5</text>
</g>
<g class="pf-a" style="animation: pfFade 0.3s 1.6s forwards">
<rect x="266" y="322" width="240" height="36" rx="4" fill="#26263e"/>
<rect x="272" y="326" width="38" height="28" rx="3" fill="#1a1a2e"/>
<path d="M 276 348 C 288 348 290 332 306 332" fill="none" stroke="#9668d4" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="344" class="pf-small" fill="#e2e2e2">distance, logistic</text>
<text x="498" y="344" text-anchor="end" class="pf-small">× 0.4</text>
</g>

<g class="pf-a" style="animation: pfFade 0.3s 1.9s forwards">
<line x1="510" y1="224" x2="546" y2="224" stroke="#888" stroke-width="1.5"/>
<polygon points="544,219 554,224 544,229" fill="#888"/>
<text x="528" y="214" text-anchor="middle" class="pf-small">multiply</text>
</g>

<g class="pf-a" style="animation: pfFade 0.4s 2.1s forwards">
<rect x="558" y="206" width="130" height="36" rx="18" fill="none" stroke="#46a866" stroke-width="1.5"/>
<text x="623" y="229" text-anchor="middle" class="pf-head" fill="#46a866">score 0.42</text>
<text x="623" y="262" text-anchor="middle" class="pf-small">one of 1,000</text>
<text x="623" y="276" text-anchor="middle" class="pf-small">keep the highest</text>
</g>

<text x="30" y="410" class="pf-label pf-a" style="animation: pfFade 0.5s 2.4s forwards">6 scorers × 1,000 actions × 200 characters = 1,200,000 evaluations per tick. Note the four curve</text>
<text x="30" y="424" class="pf-label pf-a" style="animation: pfFade 0.5s 2.4s forwards">shapes: they are different programs, and the SIMD section comes back to that.</text>
</svg>
