<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
<style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .pf-title { font-size: 14px; font-weight: 600; fill: #e2e2e2; }
    .pf-label { font-size: 11px; fill: #a0a0a0; }
    .pf-small { font-size: 10px; fill: #888; }
    .pf-cell { font-size: 10px; fill: #e2e2e2; }
    .pf-head { font-size: 12px; font-weight: 600; }
    .pf-a { opacity: 0; }
    @keyframes pfFade { to { opacity: 1; } }
</style>
<rect width="720" height="420" fill="#1a1a2e" rx="8"/>
<text x="30" y="34" class="pf-title">Which four things go in the register</text>
<text x="30" y="54" class="pf-small">the lanes have to want the same operation, so the choice of axis decides whether it works at all</text>

<g class="pf-a" style="animation: pfFade 0.4s 0.30s forwards">
<rect x="30" y="76" width="320" height="300" rx="8" fill="#20203a"/>
<text x="190" y="102" text-anchor="middle" class="pf-head" fill="#c44e7c">four scorers</text>
<text x="190" y="120" text-anchor="middle" class="pf-small">one character, four scorers side by side</text>

<rect x="52" y="138" width="276" height="26" rx="4" fill="#c44e7c" fill-opacity="0.16"/>
<text x="66" y="155" class="pf-cell">lane 0</text><text x="130" y="155" class="pf-cell" fill="#c44e7c">linear</text>
<rect x="52" y="170" width="276" height="26" rx="4" fill="#c44e7c" fill-opacity="0.16"/>
<text x="66" y="187" class="pf-cell">lane 1</text><text x="130" y="187" class="pf-cell" fill="#d18238">gaussian</text>
<rect x="52" y="202" width="276" height="26" rx="4" fill="#c44e7c" fill-opacity="0.16"/>
<text x="66" y="219" class="pf-cell">lane 2</text><text x="130" y="219" class="pf-cell" fill="#9668d4">logistic</text>
<rect x="52" y="234" width="276" height="26" rx="4" fill="#c44e7c" fill-opacity="0.16"/>
<text x="66" y="251" class="pf-cell">lane 3</text><text x="130" y="251" class="pf-cell" fill="#46a866">quadratic</text>

<text x="190" y="290" text-anchor="middle" class="pf-small" fill="#c44e7c">four different curves in one register</text>
<text x="190" y="310" text-anchor="middle" class="pf-small">every lane must compute all four kinds,</text>
<text x="190" y="326" text-anchor="middle" class="pf-small">then throw three of them away</text>
<text x="190" y="352" text-anchor="middle" class="pf-cell" fill="#c44e7c">4x the arithmetic for 4x the lanes</text>
</g>

<g class="pf-a" style="animation: pfFade 0.4s 0.85s forwards">
<rect x="370" y="76" width="320" height="300" rx="8" fill="#20203a"/>
<text x="530" y="102" text-anchor="middle" class="pf-head" fill="#4a8ccc">four characters</text>
<text x="530" y="120" text-anchor="middle" class="pf-small">one scorer, four characters side by side</text>

<rect x="392" y="138" width="276" height="26" rx="4" fill="#4a8ccc" fill-opacity="0.16"/>
<text x="406" y="155" class="pf-cell">lane 0</text><text x="470" y="155" class="pf-cell" fill="#4a8ccc">linear</text><text x="546" y="155" class="pf-small">hunger 0.7</text>
<rect x="392" y="170" width="276" height="26" rx="4" fill="#4a8ccc" fill-opacity="0.16"/>
<text x="406" y="187" class="pf-cell">lane 1</text><text x="470" y="187" class="pf-cell" fill="#4a8ccc">linear</text><text x="546" y="187" class="pf-small">hunger 0.2</text>
<rect x="392" y="202" width="276" height="26" rx="4" fill="#4a8ccc" fill-opacity="0.16"/>
<text x="406" y="219" class="pf-cell">lane 2</text><text x="470" y="219" class="pf-cell" fill="#4a8ccc">linear</text><text x="546" y="219" class="pf-small">hunger 0.9</text>
<rect x="392" y="234" width="276" height="26" rx="4" fill="#4a8ccc" fill-opacity="0.16"/>
<text x="406" y="251" class="pf-cell">lane 3</text><text x="470" y="251" class="pf-cell" fill="#4a8ccc">linear</text><text x="546" y="251" class="pf-small">hunger 0.4</text>

<text x="530" y="290" text-anchor="middle" class="pf-small" fill="#4a8ccc">one curve, one branch, four results</text>
<text x="530" y="310" text-anchor="middle" class="pf-small">the switch stays scalar and serves all four,</text>
<text x="530" y="326" text-anchor="middle" class="pf-small">only the per-character data goes wide</text>
<text x="530" y="352" text-anchor="middle" class="pf-cell" fill="#4a8ccc">4x the work in 1x the time</text>
</g>

<text x="30" y="400" class="pf-label pf-a" style="animation: pfFade 0.5s 1.4s forwards">Four characters share an action and a scorer, so the curve and all its constants are identical across the lanes.</text>
</svg>
