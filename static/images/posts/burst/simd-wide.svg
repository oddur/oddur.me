<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
<style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .pf-title { font-size: 14px; font-weight: 600; fill: #e2e2e2; }
    .pf-label { font-size: 11px; fill: #a0a0a0; }
    .pf-small { font-size: 10px; fill: #888; }
    .pf-cell { font-size: 11px; font-weight: 600; fill: #e2e2e2; }
    .pf-op { font-size: 13px; fill: #a0a0a0; }
    .pf-a { opacity: 0; }
    @keyframes pfFade { to { opacity: 1; } }
    @keyframes pfGrow { to { transform: scaleX(1); } }
</style>
<rect width="720" height="400" fill="#1a1a2e" rx="8"/>
<text x="30" y="34" class="pf-title">The same four multiplies, two ways</text>
<text x="30" y="54" class="pf-small">scalar does them one after another, four wide does them in one instruction</text>

<text x="30" y="106" class="pf-label">scalar</text>
<text x="30" y="122" class="pf-small">four steps</text>

<g class="pf-a" style="animation: pfFade 0.35s 0.30s forwards">
<rect x="180" y="84" width="44" height="24" rx="4" fill="#4a8ccc" fill-opacity="0.3" stroke="#4a8ccc"/><text x="202" y="101" text-anchor="middle" class="pf-cell">a0</text>
<text x="202" y="126" text-anchor="middle" class="pf-op">×</text>
<rect x="180" y="132" width="44" height="24" rx="4" fill="#c77730" fill-opacity="0.3" stroke="#c77730"/><text x="202" y="149" text-anchor="middle" class="pf-cell">b0</text>
<line x1="202" y1="160" x2="202" y2="178" stroke="#888" stroke-width="1.2"/><polygon points="198,174 202,181 206,174" fill="#888"/>
<rect x="180" y="182" width="44" height="24" rx="4" fill="#46a866" fill-opacity="0.35" stroke="#46a866"/><text x="202" y="199" text-anchor="middle" class="pf-cell">c0</text>
<text x="202" y="224" text-anchor="middle" class="pf-small">step 1</text>
</g>

<g class="pf-a" style="animation: pfFade 0.35s 0.60s forwards">
<rect x="298" y="84" width="44" height="24" rx="4" fill="#4a8ccc" fill-opacity="0.3" stroke="#4a8ccc"/><text x="320" y="101" text-anchor="middle" class="pf-cell">a1</text>
<text x="320" y="126" text-anchor="middle" class="pf-op">×</text>
<rect x="298" y="132" width="44" height="24" rx="4" fill="#c77730" fill-opacity="0.3" stroke="#c77730"/><text x="320" y="149" text-anchor="middle" class="pf-cell">b1</text>
<line x1="320" y1="160" x2="320" y2="178" stroke="#888" stroke-width="1.2"/><polygon points="316,174 320,181 324,174" fill="#888"/>
<rect x="298" y="182" width="44" height="24" rx="4" fill="#46a866" fill-opacity="0.35" stroke="#46a866"/><text x="320" y="199" text-anchor="middle" class="pf-cell">c1</text>
<text x="320" y="224" text-anchor="middle" class="pf-small">step 2</text>
</g>

<g class="pf-a" style="animation: pfFade 0.35s 0.90s forwards">
<rect x="416" y="84" width="44" height="24" rx="4" fill="#4a8ccc" fill-opacity="0.3" stroke="#4a8ccc"/><text x="438" y="101" text-anchor="middle" class="pf-cell">a2</text>
<text x="438" y="126" text-anchor="middle" class="pf-op">×</text>
<rect x="416" y="132" width="44" height="24" rx="4" fill="#c77730" fill-opacity="0.3" stroke="#c77730"/><text x="438" y="149" text-anchor="middle" class="pf-cell">b2</text>
<line x1="438" y1="160" x2="438" y2="178" stroke="#888" stroke-width="1.2"/><polygon points="434,174 438,181 442,174" fill="#888"/>
<rect x="416" y="182" width="44" height="24" rx="4" fill="#46a866" fill-opacity="0.35" stroke="#46a866"/><text x="438" y="199" text-anchor="middle" class="pf-cell">c2</text>
<text x="438" y="224" text-anchor="middle" class="pf-small">step 3</text>
</g>

<g class="pf-a" style="animation: pfFade 0.35s 1.20s forwards">
<rect x="534" y="84" width="44" height="24" rx="4" fill="#4a8ccc" fill-opacity="0.3" stroke="#4a8ccc"/><text x="556" y="101" text-anchor="middle" class="pf-cell">a3</text>
<text x="556" y="126" text-anchor="middle" class="pf-op">×</text>
<rect x="534" y="132" width="44" height="24" rx="4" fill="#c77730" fill-opacity="0.3" stroke="#c77730"/><text x="556" y="149" text-anchor="middle" class="pf-cell">b3</text>
<line x1="556" y1="160" x2="556" y2="178" stroke="#888" stroke-width="1.2"/><polygon points="552,174 556,181 560,174" fill="#888"/>
<rect x="534" y="182" width="44" height="24" rx="4" fill="#46a866" fill-opacity="0.35" stroke="#46a866"/><text x="556" y="199" text-anchor="middle" class="pf-cell">c3</text>
<text x="556" y="224" text-anchor="middle" class="pf-small">step 4</text>
</g>

<line x1="30" y1="252" x2="690" y2="252" stroke="#2e2e4a" stroke-width="1"/>

<text x="30" y="290" class="pf-label">four wide</text>
<text x="30" y="306" class="pf-small">one step</text>

<g class="pf-a" style="animation: pfFade 0.4s 1.65s forwards">
<rect x="176" y="270" width="406" height="28" rx="5" fill="none" stroke="#4a8ccc" stroke-opacity="0.5" stroke-dasharray="3 3"/>
<rect x="180" y="274" width="44" height="20" rx="3" fill="#4a8ccc" fill-opacity="0.3"/><text x="202" y="289" text-anchor="middle" class="pf-cell">a0</text>
<rect x="298" y="274" width="44" height="20" rx="3" fill="#4a8ccc" fill-opacity="0.3"/><text x="320" y="289" text-anchor="middle" class="pf-cell">a1</text>
<rect x="416" y="274" width="44" height="20" rx="3" fill="#4a8ccc" fill-opacity="0.3"/><text x="438" y="289" text-anchor="middle" class="pf-cell">a2</text>
<rect x="534" y="274" width="44" height="20" rx="3" fill="#4a8ccc" fill-opacity="0.3"/><text x="556" y="289" text-anchor="middle" class="pf-cell">a3</text>
<text x="606" y="289" class="pf-op">×</text>

<rect x="176" y="306" width="406" height="28" rx="5" fill="none" stroke="#c77730" stroke-opacity="0.5" stroke-dasharray="3 3"/>
<rect x="180" y="310" width="44" height="20" rx="3" fill="#c77730" fill-opacity="0.3"/><text x="202" y="325" text-anchor="middle" class="pf-cell">b0</text>
<rect x="298" y="310" width="44" height="20" rx="3" fill="#c77730" fill-opacity="0.3"/><text x="320" y="325" text-anchor="middle" class="pf-cell">b1</text>
<rect x="416" y="310" width="44" height="20" rx="3" fill="#c77730" fill-opacity="0.3"/><text x="438" y="325" text-anchor="middle" class="pf-cell">b2</text>
<rect x="534" y="310" width="44" height="20" rx="3" fill="#c77730" fill-opacity="0.3"/><text x="556" y="325" text-anchor="middle" class="pf-cell">b3</text>

<rect x="176" y="342" width="406" height="28" rx="5" fill="none" stroke="#46a866" stroke-opacity="0.6" stroke-dasharray="3 3"/>
<rect x="180" y="346" width="44" height="20" rx="3" fill="#46a866" fill-opacity="0.35"/><text x="202" y="361" text-anchor="middle" class="pf-cell">c0</text>
<rect x="298" y="346" width="44" height="20" rx="3" fill="#46a866" fill-opacity="0.35"/><text x="320" y="361" text-anchor="middle" class="pf-cell">c1</text>
<rect x="416" y="346" width="44" height="20" rx="3" fill="#46a866" fill-opacity="0.35"/><text x="438" y="361" text-anchor="middle" class="pf-cell">c2</text>
<rect x="534" y="346" width="44" height="20" rx="3" fill="#46a866" fill-opacity="0.35"/><text x="556" y="361" text-anchor="middle" class="pf-cell">c3</text>
<text x="606" y="361" class="pf-small">one register</text>
</g>
</svg>
