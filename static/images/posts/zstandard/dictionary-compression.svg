<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #e2e2e2; }
    .label { font-size: 11px; fill: #a0a0a0; }
    .small { font-size: 10px; fill: #888; }
    .result { font-size: 13px; font-weight: 600; }
    .box { rx: 4; ry: 4; }

    /* Message bytes - no dictionary side */
    .msg-byte { fill: #4a7dbd; opacity: 0; }
    .msg-byte:nth-child(1) { animation: fadeIn 0.3s 0.5s forwards; }
    .msg-byte:nth-child(2) { animation: fadeIn 0.3s 0.6s forwards; }
    .msg-byte:nth-child(3) { animation: fadeIn 0.3s 0.7s forwards; }
    .msg-byte:nth-child(4) { animation: fadeIn 0.3s 0.8s forwards; }
    .msg-byte:nth-child(5) { animation: fadeIn 0.3s 0.9s forwards; }
    .msg-byte:nth-child(6) { animation: fadeIn 0.3s 1.0s forwards; }
    .msg-byte:nth-child(7) { animation: fadeIn 0.3s 1.1s forwards; }
    .msg-byte:nth-child(8) { animation: fadeIn 0.3s 1.2s forwards; }

    /* Compressed without dict - barely shrinks */
    .no-dict-out { opacity: 0; }
    .no-dict-out:nth-child(1) { animation: fadeIn 0.3s 2.0s forwards; }
    .no-dict-out:nth-child(2) { animation: fadeIn 0.3s 2.1s forwards; }
    .no-dict-out:nth-child(3) { animation: fadeIn 0.3s 2.2s forwards; }
    .no-dict-out:nth-child(4) { animation: fadeIn 0.3s 2.3s forwards; }
    .no-dict-out:nth-child(5) { animation: fadeIn 0.3s 2.4s forwards; }
    .no-dict-out:nth-child(6) { animation: fadeIn 0.3s 2.5s forwards; }
    .no-dict-out:nth-child(7) { animation: fadeIn 0.3s 2.6s forwards; }

    /* Dictionary entries */
    .dict-entry { opacity: 0; }
    .dict-entry:nth-child(1) { animation: fadeIn 0.4s 0.5s forwards; }
    .dict-entry:nth-child(2) { animation: fadeIn 0.4s 0.7s forwards; }
    .dict-entry:nth-child(3) { animation: fadeIn 0.4s 0.9s forwards; }
    .dict-entry:nth-child(4) { animation: fadeIn 0.4s 1.1s forwards; }

    /* Message bytes - dictionary side */
    .msg2-byte { fill: #4a7dbd; opacity: 0; }
    .msg2-byte:nth-child(1) { animation: fadeIn 0.3s 1.5s forwards; }
    .msg2-byte:nth-child(2) { animation: fadeIn 0.3s 1.6s forwards; }
    .msg2-byte:nth-child(3) { animation: fadeIn 0.3s 1.7s forwards; }
    .msg2-byte:nth-child(4) { animation: fadeIn 0.3s 1.8s forwards; }
    .msg2-byte:nth-child(5) { animation: fadeIn 0.3s 1.9s forwards; }
    .msg2-byte:nth-child(6) { animation: fadeIn 0.3s 2.0s forwards; }
    .msg2-byte:nth-child(7) { animation: fadeIn 0.3s 2.1s forwards; }
    .msg2-byte:nth-child(8) { animation: fadeIn 0.3s 2.2s forwards; }

    /* Highlight matching sequences */
    .match-highlight { opacity: 0; animation: highlightPulse 1.5s 2.8s forwards; }

    /* Compressed with dict - shrinks a lot */
    .dict-out { opacity: 0; }
    .dict-out:nth-child(1) { animation: fadeIn 0.3s 4.0s forwards; }
    .dict-out:nth-child(2) { animation: fadeIn 0.3s 4.1s forwards; }
    .dict-out:nth-child(3) { animation: fadeIn 0.3s 4.2s forwards; }

    /* Result labels */
    .result-no { opacity: 0; animation: fadeIn 0.5s 3.0s forwards; }
    .result-yes { opacity: 0; animation: fadeIn 0.5s 4.5s forwards; }

    /* Arrow */
    .arrow { opacity: 0; }
    .arrow-no { animation: fadeIn 0.3s 1.6s forwards; }
    .arrow-yes { animation: fadeIn 0.3s 3.5s forwards; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes highlightPulse {
      0% { opacity: 0; }
      30% { opacity: 0.3; }
      60% { opacity: 0.15; }
      100% { opacity: 0.2; }
    }
  </style>

  <rect width="720" height="400" fill="#1a1a2e" rx="8"/>

  <!-- LEFT SIDE: Without Dictionary -->
  <text x="170" y="30" text-anchor="middle" class="title">Without Dictionary</text>

  <!-- Original message -->
  <text x="30" y="65" class="label">Single gRPC message</text>
  <g>
    <rect class="msg-byte box" x="30" y="75" width="36" height="22" />
    <rect class="msg-byte box" x="70" y="75" width="36" height="22" />
    <rect class="msg-byte box" x="110" y="75" width="36" height="22" />
    <rect class="msg-byte box" x="150" y="75" width="36" height="22" />
    <rect class="msg-byte box" x="190" y="75" width="36" height="22" />
    <rect class="msg-byte box" x="230" y="75" width="36" height="22" />
    <rect class="msg-byte box" x="270" y="75" width="36" height="22" />
    <rect class="msg-byte box" x="310" y="75" width="36" height="22" />
  </g>

  <!-- Arrow down -->
  <g class="arrow arrow-no">
    <line x1="170" y1="105" x2="170" y2="140" stroke="#555" stroke-width="1.5"/>
    <polygon points="165,138 170,148 175,138" fill="#555"/>
    <text x="185" y="130" class="small">zstd compress</text>
  </g>

  <!-- Compressed output - barely smaller -->
  <text x="30" y="165" class="label" opacity="0" style="animation: fadeIn 0.3s 1.8s forwards;">Compressed</text>
  <g>
    <rect class="no-dict-out box" x="30" y="175" width="36" height="22" fill="#7a5c8a"/>
    <rect class="no-dict-out box" x="70" y="175" width="36" height="22" fill="#7a5c8a"/>
    <rect class="no-dict-out box" x="110" y="175" width="36" height="22" fill="#7a5c8a"/>
    <rect class="no-dict-out box" x="150" y="175" width="36" height="22" fill="#7a5c8a"/>
    <rect class="no-dict-out box" x="190" y="175" width="36" height="22" fill="#7a5c8a"/>
    <rect class="no-dict-out box" x="230" y="175" width="36" height="22" fill="#7a5c8a"/>
    <rect class="no-dict-out box" x="270" y="175" width="36" height="22" fill="#7a5c8a"/>
  </g>

  <!-- Result -->
  <text x="170" y="225" text-anchor="middle" class="result result-no" fill="#e06060">Barely compresses</text>
  <text x="170" y="242" text-anchor="middle" class="small result-no">Too little context in a single message</text>

  <!-- Divider -->
  <line x1="360" y1="15" x2="360" y2="385" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT SIDE: With Dictionary -->
  <text x="540" y="30" text-anchor="middle" class="title">With Dictionary</text>

  <!-- Dictionary -->
  <text x="400" y="65" class="label">Trained dictionary (common patterns)</text>
  <g>
    <rect class="dict-entry box" x="400" y="75" width="72" height="20" fill="#2d6a4f" />
    <text x="436" y="89" text-anchor="middle" class="small" style="fill:#8fc9a9; opacity:0; animation: fadeIn 0.4s 0.6s forwards;">hdr:field_id</text>
    <rect class="dict-entry box" x="478" y="75" width="72" height="20" fill="#2d6a4f" />
    <text x="514" y="89" text-anchor="middle" class="small" style="fill:#8fc9a9; opacity:0; animation: fadeIn 0.4s 0.8s forwards;">obj_prefix</text>
    <rect class="dict-entry box" x="556" y="75" width="72" height="20" fill="#2d6a4f" />
    <text x="592" y="89" text-anchor="middle" class="small" style="fill:#8fc9a9; opacity:0; animation: fadeIn 0.4s 1.0s forwards;">proto_frame</text>
    <rect class="dict-entry box" x="634" y="75" width="52" height="20" fill="#2d6a4f" />
    <text x="660" y="89" text-anchor="middle" class="small" style="fill:#8fc9a9; opacity:0; animation: fadeIn 0.4s 1.2s forwards;">...</text>
  </g>

  <!-- Same original message -->
  <text x="400" y="130" class="label" style="opacity:0; animation: fadeIn 0.3s 1.3s forwards;">Same message</text>
  <g>
    <rect class="msg2-byte box" x="400" y="140" width="36" height="22" />
    <rect class="msg2-byte box" x="440" y="140" width="36" height="22" />
    <rect class="msg2-byte box" x="480" y="140" width="36" height="22" />
    <rect class="msg2-byte box" x="520" y="140" width="36" height="22" />
    <rect class="msg2-byte box" x="560" y="140" width="36" height="22" />
    <rect class="msg2-byte box" x="600" y="140" width="36" height="22" />
    <rect class="msg2-byte box" x="640" y="140" width="36" height="22" />
    <rect class="msg2-byte box" x="680" y="140" width="36" height="22" />
  </g>

  <!-- Highlight matches between dict and message -->
  <rect class="match-highlight" x="400" y="140" width="76" height="22" fill="#2d6a4f" rx="4"/>
  <rect class="match-highlight" x="520" y="140" width="116" height="22" fill="#2d6a4f" rx="4"/>
  <rect class="match-highlight" x="678" y="140" width="38" height="22" fill="#2d6a4f" rx="4"/>

  <!-- Arrow down -->
  <g class="arrow arrow-yes">
    <line x1="540" y1="170" x2="540" y2="205" stroke="#555" stroke-width="1.5"/>
    <polygon points="535,203 540,213 545,203" fill="#555"/>
    <text x="555" y="195" class="small">zstd + dictionary</text>
  </g>

  <!-- Compressed output - much smaller -->
  <text x="400" y="230" class="label" style="opacity:0; animation: fadeIn 0.3s 3.8s forwards;">Compressed</text>
  <g>
    <rect class="dict-out box" x="400" y="240" width="28" height="22" fill="#2d6a4f"/>
    <rect class="dict-out box" x="432" y="240" width="28" height="22" fill="#7a5c8a"/>
    <rect class="dict-out box" x="464" y="240" width="28" height="22" fill="#2d6a4f"/>
  </g>

  <!-- Legend for compressed -->
  <rect x="400" y="275" width="10" height="10" fill="#2d6a4f" rx="2" opacity="0" style="animation: fadeIn 0.3s 4.3s forwards;"/>
  <text x="415" y="284" class="small" style="opacity:0; animation: fadeIn 0.3s 4.3s forwards;">= dict reference</text>
  <rect x="490" y="275" width="10" height="10" fill="#7a5c8a" rx="2" opacity="0" style="animation: fadeIn 0.3s 4.3s forwards;"/>
  <text x="505" y="284" class="small" style="opacity:0; animation: fadeIn 0.3s 4.3s forwards;">= new data</text>

  <!-- Result -->
  <text x="540" y="320" text-anchor="middle" class="result result-yes" fill="#4ade80">Significant reduction</text>
  <text x="540" y="337" text-anchor="middle" class="small result-yes">Dictionary provides the missing context</text>

  <!-- Bottom summary -->
  <rect x="30" y="360" width="660" height="30" fill="#252540" rx="6" opacity="0" style="animation: fadeIn 0.5s 5.0s forwards;"/>
  <text x="360" y="380" text-anchor="middle" class="label" style="opacity:0; animation: fadeIn 0.5s 5.0s forwards; fill:#c0c0c0;">The dictionary gives zstd knowledge of common patterns, so even tiny messages compress well.</text>
</svg>
